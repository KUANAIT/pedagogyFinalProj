<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6fb2" />
      <stop offset="100%" stop-color="#0e4370" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  
  <!-- Graduation cap / Learning icon -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Cap top -->
    <polygon points="32,16 54,26 32,36 10,26" />
    <!-- Cap lower arc -->
    <path d="M19,30.5 v8 c0,6.5 5.8,11.5 13,11.5 s13,-5 13,-11.5 v-8 l-13,6.5 z" />
    <!-- Tassel string and tassel -->
    <path d="M49,28.5 v14.5" stroke="#f6ad55" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="49" cy="44" r="2.5" fill="#f6ad55" />
  </g>
</svg>
